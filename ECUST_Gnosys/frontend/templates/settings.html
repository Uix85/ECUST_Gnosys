<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 · Gnosys</title><link rel="stylesheet" href="/static/css/workspace.css?v={{ asset_version() }}">
{% include 'scrollbar.html' %}
<style>
.settings-shell{max-width:780px;margin:0 auto;padding:64px 24px 60px}
.settings-back{display:flex;align-items:center;justify-content:center;width:max-content;min-width:52px;height:32px;margin:0 0 16px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;line-height:1;text-align:center;text-decoration:none}
.settings-back:hover{background:var(--blue-soft);border-color:#b5c9eb;color:var(--blue);text-decoration:none}
.settings-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
.settings-card h2{margin:0 0 4px;font-size:15px}
.settings-card p.hint{margin:0 0 14px;font-size:12px;color:var(--muted)}
.settings-row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 16px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.settings-row:first-of-type{border-top:0}
.settings-row label{font-size:13px}
.settings-row .meta{grid-column:1;font-size:11px;color:var(--muted)}
.settings-row input[type=text],.settings-row input[type=password],.settings-row input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px}
.settings-row.checkbox{grid-template-columns:minmax(0,1fr) auto}
.settings-foot{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.settings-foot .muted{font-size:12px}
.settings-ok{color:#15803d}
</style></head>
<body class="library-page">
<main class="settings-shell">
 <a id="settings-back" class="settings-back" href="/" title="返回">返回</a>
 <div class="library-top"><div><div class="eyebrow">SETTINGS</div><h1>设置</h1><p>设置和 API 密钥保存在项目目录的 <code>database/settings.db</code>，下一次 Agent 调用生效，无需重启。</p></div></div>
 <div id="status-line" class="muted" role="status"></div>
 <form id="settings-form"></form>
 <div class="settings-foot"><button class="primary" id="save" type="submit" form="settings-form">保存并返回</button><button id="reload" type="button">重新读取</button><span class="muted" id="saved-at"></span></div>
 <p class="muted" id="paths" style="margin-top:22px;font-size:12px"></p>
</main>
<script>
const form=document.getElementById('settings-form'),statusLine=document.getElementById('status-line'),
      savedAt=document.getElementById('saved-at'),paths=document.getElementById('paths');
const GROUPS=[['连接',['AGENT_API_BASE_URL','AGENT_MODEL','AGENT_API_KEY','AGENT_SESSION_ID']],
              ['预算与超时',['AGENT_REQUEST_TIMEOUT','AGENT_MAX_REQUESTS','AGENT_MAX_TOOL_CALLS','AGENT_RUN_TIMEOUT','AGENT_MAX_RETRIES','AGENT_MAX_PARALLEL']],
              ['行为',['AGENT_DISABLE_THINKING']]];
const SOURCE={database:'来自 database/settings.db',default:'默认值'};
let fields=[];
async function errorMessage(response){const data=await response.json().catch(()=>({}));return data.error?.message||data.detail||`HTTP ${response.status}`;}
function row(f){
  const wrap=document.createElement('div');
  if(f.kind==='bool'){
    wrap.className='settings-row checkbox';
    const lab=document.createElement('label');lab.htmlFor='f-'+f.key;lab.textContent=f.label;
    const box=document.createElement('input');box.type='checkbox';box.id='f-'+f.key;box.checked=f.value==='1';
    wrap.append(lab,box);
    if(f.help){const meta=document.createElement('div');meta.className='meta';meta.textContent=f.help;wrap.append(meta);}
    return wrap;
  }
  const lab=document.createElement('label');lab.htmlFor='f-'+f.key;lab.textContent=f.label;
  const input=document.createElement('input');
  input.id='f-'+f.key;
  input.type=f.kind==='secret'?'password':(f.kind==='int'||f.kind==='float'?'number':'text');
  if(f.kind==='int')input.step='1';
  if(f.kind==='float')input.step='any';
  input.value=f.kind==='secret'?'':(f.value??'');
  if(f.kind==='secret')input.placeholder=f.hint||'未设置';
  const meta=document.createElement('div');meta.className='meta';
  meta.textContent=[f.help,SOURCE[f.source]].filter(Boolean).join(' · ');
  wrap.append(lab,input,meta);
  return wrap;
}
function render(data){
  fields=data.items;form.replaceChildren();
  for(const [title,keys] of GROUPS){
    const card=document.createElement('section');card.className='settings-card';
    const h=document.createElement('h2');h.textContent=title;card.append(h);
    const p=document.createElement('p');p.className='hint';
    p.textContent=title==='连接'?'模型服务地址与凭据。密钥留空表示不修改，不会回显。':'单个 Agent 任务的预算设置。';
    card.append(p);
    for(const key of keys){const f=fields.find(x=>x.key===key);if(f)card.append(row(f));}
    form.append(card);
  }
  statusLine.textContent=data.ready?`已配置：${data.model} @ ${data.base_url}`:'尚未配置 API 密钥，Agent 功能不可用';
  statusLine.className=data.ready?'settings-ok':'';
  paths.textContent='设置数据库：'+data.settings_db;
}
function settingsReturnTarget(){
  let target=new URLSearchParams(location.search).get('from')||'';
  if(!target&&document.referrer){
    try{const ref=new URL(document.referrer);if(ref.origin===location.origin&&ref.pathname!==location.pathname)target=ref.pathname+ref.search+ref.hash;}catch(e){}
  }
  try {
    const url=new URL(target||'/',location.origin);
    if(url.origin!==location.origin||url.pathname.startsWith('/settings'))return '/';
    return url.pathname+url.search+url.hash;
  } catch(e) { return '/'; }
}
async function load(){
  const r=await fetch('/api/v1/settings');if(!r.ok)throw new Error(await errorMessage(r));render(await r.json());
}
form.addEventListener('submit',async e=>{
  e.preventDefault();const values={};
  for(const f of fields){
    const el=document.getElementById('f-'+f.key);if(!el)continue;
    if(f.kind==='bool')values[f.key]=el.checked?'1':'0';
    else if(f.kind==='secret'){if(el.value.trim())values[f.key]=el.value.trim();}
    else values[f.key]=el.value;
  }
  document.getElementById('save').disabled=true;
  try{
    const r=await fetch('/api/v1/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error?.message||data.detail||'保存失败');
    render(data);savedAt.textContent='已保存 '+new Date().toLocaleTimeString();
    location.assign(settingsReturnTarget());
  }catch(err){statusLine.className='';statusLine.textContent='保存失败：'+err.message;}
  finally{document.getElementById('save').disabled=false;}
});
document.getElementById('reload').onclick=()=>load().catch(e=>statusLine.textContent=e.message);
load().catch(e=>statusLine.textContent='读取设置失败：'+e.message);
(function(){
  const back=document.getElementById('settings-back');if(!back)return;
  back.href=settingsReturnTarget();
})();
</script></body></html>
