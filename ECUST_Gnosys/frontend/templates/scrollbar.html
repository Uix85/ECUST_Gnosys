{# ═══════════════════════════════════════════════
   全局滚动条：6px 蓝灰圆角滑块、透明轨道；
   滚动时显示，停止滚动约 0.8s 后自动隐藏。
   ═══════════════════════════════════════════════ #}
<style>
    :root{--sb-thumb:rgba(111,137,171,.62);--sb-thumb-hover:rgba(82,112,150,.78)}
    *::-webkit-scrollbar { width:6px; height:6px; }
    *::-webkit-scrollbar-track { background:transparent; }
    *::-webkit-scrollbar-corner { background:transparent; }
    *::-webkit-scrollbar-button { display:none; }
    *::-webkit-scrollbar-thumb { background:transparent; border-radius:999px; }
    .scrolling::-webkit-scrollbar-thumb { background:var(--sb-thumb); }
    .scrolling::-webkit-scrollbar-thumb:hover { background:var(--sb-thumb-hover); }
    @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width:thin; scrollbar-color:transparent transparent; }
        .scrolling { scrollbar-color:var(--sb-thumb) transparent; }
    }
</style>
<script>
(function() {
    var HIDE_DELAY = 800;
    document.addEventListener('scroll', function(e) {
        var t = e.target === document ? document.scrollingElement : e.target;
        if (!t || t.nodeType !== 1) return;
        t.classList.add('scrolling');
        clearTimeout(t._sbHide);
        t._sbHide = setTimeout(function() { t.classList.remove('scrolling'); }, HIDE_DELAY);
    }, true);
})();
</script>
