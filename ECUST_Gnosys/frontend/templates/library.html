<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书库 · Gnosys</title><link rel="stylesheet" href="/static/css/workspace.css?v={{ asset_version() }}">{% include 'scrollbar.html' %}</head>
<body class="library-page"><header class="appbar"><a class="brand" href="/" aria-label="Gnosys 书库"><svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path class="page-back" d="M31 9.2c-4.2-2.2-8.4-1.5-13 2v15.4c4.6-3.5 8.8-4.2 13-2z"/><path class="page-front" d="M5 9.2c4.2-2.2 8.4-1.5 13 2v15.4c-4.6-3.5-8.8-4.2-13-2z"/><path class="book-spine" d="M18 11.2v15.4"/></svg><span class="brand-text">Gnosys</span></a><span class="bar-divider"></span><span class="brand-tagline">阅读 · 理解 · 对话</span><div class="bar-actions"><a class="icon-button" href="/settings?from=%2F" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a></div></header>
<main class="library-shell"><div class="library-top"><div><h1>我的书库</h1></div><button class="primary" id="import-book">＋ 导入书籍</button></div>
<div class="library-tools"><label class="sr-only" for="library-search">搜索书籍或作者</label><input type="search" id="library-search" placeholder="搜索书籍、作者…"><span class="muted" id="book-count">0 本书</span></div>
<input type="file" id="book-file" accept=".epub,.txt" hidden><div id="upload-status" role="status" class="muted"></div>
<div class="book-grid" id="book-grid"></div>
<div class="library-empty" id="library-empty" hidden><h2>在这里开始一本书</h2><p>导入 EPUB 或 TXT，阅读进度和笔记会保存在本机。</p></div>
<p id="no-results" class="library-empty" hidden>没有匹配的书籍</p><div id="toast" role="status" hidden></div></main><button id="app-version" class="app-version" type="button" title="查看更新日志" aria-haspopup="dialog" aria-controls="changelog-dialog">{{ app_version }}</button><dialog id="changelog-dialog" class="changelog-dialog" aria-labelledby="changelog-title"><header class="changelog-head"><h2 id="changelog-title">更新日志</h2><button id="changelog-close" class="changelog-close" type="button" aria-label="关闭更新日志">×</button></header><div class="changelog-list">{% for entry in changelog %}<section class="changelog-entry"><div class="changelog-version">{{ entry.version }} <time>{{ entry.date }}</time></div><ul>{% for change in entry.changes %}<li>{{ change }}</li>{% endfor %}</ul></section>{% endfor %}</div></dialog>
<script>
const input=document.getElementById('book-file'),trigger=document.getElementById('import-book'),status=document.getElementById('upload-status');
const grid=document.getElementById('book-grid'),search=document.getElementById('library-search'),empty=document.getElementById('library-empty');
trigger.onclick=()=>input.click();
input.onchange=async()=>{if(!input.files.length)return;trigger.disabled=true;status.textContent='正在导入，请稍候…';const body=new FormData();body.append('file',input.files[0]);try{const r=await fetch('/api/v1/books/import',{method:'POST',body});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||data.detail);status.textContent='已导入 '+data.title;location.reload();}catch(e){status.textContent=e.message;trigger.disabled=false;input.value='';}};
function updateCount(){const cards=[...grid.querySelectorAll('.book-card')],count=cards.filter(card=>!card.hidden).length,total=cards.length;document.getElementById('book-count').textContent=count+' 本书';empty.hidden=total!==0;document.getElementById('no-results').hidden=count>0||total===0;}
function bindDelete(button){button.onclick=async()=>{if(!confirm('删除《'+button.dataset.title+'》及其本地笔记？'))return;try{const r=await fetch('/api/v1/books/'+encodeURIComponent(button.dataset.book),{method:'DELETE'});const data=await r.json();if(!r.ok)throw new Error(data.error?.message||data.detail);button.closest('.book-card').remove();search.dispatchEvent(new Event('input'));}catch(e){status.textContent=e.message;}};}
function renderBooks(items){grid.replaceChildren();items.forEach(book=>{const card=document.createElement('article');card.className='book-card';card.dataset.search=(book.title+' '+book.author).toLowerCase();const body=document.createElement('div');body.className='book-card-body';const title=document.createElement('h2');title.textContent=book.title;const author=document.createElement('p');author.textContent=book.author||'作者未标注';const actions=document.createElement('div');actions.className='book-actions';const open=document.createElement('a');open.href='/read/'+encodeURIComponent(book.id);open.textContent='继续阅读';const remove=document.createElement('button');remove.className='delete-book danger';remove.dataset.book=book.id;remove.dataset.title=book.title;remove.textContent='删除';bindDelete(remove);actions.append(open,remove);body.append(title,author,actions);card.append(body);grid.append(card);});updateCount();}
search.oninput=e=>{const query=e.target.value.toLowerCase();grid.querySelectorAll('.book-card').forEach(card=>card.hidden=!card.dataset.search.includes(query));updateCount();};
fetch('/api/v1/books').then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error?.message||data.detail);renderBooks(data.items);}).catch(e=>{status.textContent=e.message;});
</script><script>
(function(){
 const trigger=document.getElementById('app-version'),dialog=document.getElementById('changelog-dialog');
 if(!trigger||!dialog)return;
 trigger.addEventListener('click',()=>{
  const selection=window.getSelection();
  if(selection&&!selection.isCollapsed&&trigger.contains(selection.anchorNode))return;
  if(!dialog.open)dialog.showModal();
 });
 document.getElementById('changelog-close')?.addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
})();
</script></body></html>
