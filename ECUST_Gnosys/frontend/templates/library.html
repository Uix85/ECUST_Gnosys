<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书库 · Gnosys</title><link rel="stylesheet" href="/static/css/workspace.css?v={{ asset_version() }}">{% include 'scrollbar.html' %}</head>
<body class="library-page"><header class="appbar"><div class="brand"><span class="brand-mark">G</span><span>Gnosys</span></div><span class="bar-divider"></span><span class="muted">阅读 · 理解 · 对话</span><div class="bar-actions"><a class="icon-button" href="/settings?from=%2F" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a></div></header>
<main class="library-shell"><div class="library-top"><div><div class="eyebrow">YOUR READING SPACE</div><h1>我的书库</h1><p>让原文、笔记和问题，在同一个地方相遇。</p></div><button class="primary" id="import-book">＋ 导入书籍</button></div>
<div class="library-tools"><label class="sr-only" for="library-search">搜索书籍或作者</label><input type="search" id="library-search" placeholder="搜索书籍、作者…"><span class="muted" id="book-count">{{ books|length }} 本书</span></div>
<input type="file" id="book-file" accept=".epub,.txt" hidden><div id="upload-status" role="status" class="muted"></div>
<div class="book-grid" id="book-grid">{% for book in books %}<article class="book-card" data-search="{{ book.title }} {{ book.author }}"><div class="book-cover" aria-hidden="true">G</div><div class="book-card-body"><h2>{{ book.title }}</h2><p>{{ book.author or '作者未标注' }}</p><div class="book-actions"><a href="/read/{{ book.id|urlencode }}">继续阅读</a><button class="delete-book danger" data-book="{{ book.id }}" data-title="{{ book.title }}">删除</button></div></div></article>{% endfor %}</div>
{% if not books %}<div class="library-empty"><h2>在这里开始一本书</h2><p>导入 EPUB 或 TXT，阅读进度和笔记会保存在本机。</p></div>{% endif %}
<p id="no-results" class="library-empty" hidden>没有匹配的书籍</p><div id="toast" role="status" hidden></div></main>
<script>
const input=document.getElementById('book-file'),trigger=document.getElementById('import-book'),status=document.getElementById('upload-status');
trigger.onclick=()=>input.click();
input.onchange=async()=>{if(!input.files.length)return;trigger.disabled=true;status.textContent='正在导入，请稍候…';const body=new FormData();body.append('file',input.files[0]);try{const r=await fetch('/upload',{method:'POST',body});const data=await r.json();if(!r.ok)throw new Error(data.detail);status.textContent='已导入 '+data.title;location.reload();}catch(e){status.textContent=e.message;trigger.disabled=false;input.value='';}};
document.getElementById('library-search').oninput=e=>{let count=0;document.querySelectorAll('.book-card').forEach(card=>{card.hidden=!card.dataset.search.toLowerCase().includes(e.target.value.toLowerCase());if(!card.hidden)count++;});document.getElementById('book-count').textContent=count+' 本书';document.getElementById('no-results').hidden=count>0;};
document.querySelectorAll('.delete-book').forEach(button=>button.onclick=async()=>{if(!confirm('删除《'+button.dataset.title+'》及其本地笔记？'))return;try{const r=await fetch('/api/books/'+encodeURIComponent(button.dataset.book),{method:'DELETE'});const data=await r.json();if(!r.ok)throw new Error(data.detail);button.closest('.book-card').remove();document.getElementById('library-search').dispatchEvent(new Event('input'));}catch(e){status.textContent=e.message;}});
</script></body></html>
