<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书库</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        .container { padding: 40px; overflow-y: auto; height: 100vh; box-sizing: border-box; }

        /* 顶部标题栏 */
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 10px; }
        .header h1 { border: none; padding: 0; margin: 0; color: #333; }

        /* 加号按钮 */
        .add-btn { width: 40px; height: 40px; border-radius: 50%; background: #3498db; color: white; border: none; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.2s; line-height: 1; }
        .add-btn:hover { background: #2980b9; transform: scale(1.1); }
        .add-btn:disabled { background: #95a5a6; cursor: not-allowed; transform: none; }

        /* 上传中旋转动画 */
        @keyframes spin { to { transform: rotate(360deg); } }
        .add-btn.uploading { pointer-events: none; }
        .add-btn.uploading::after { content: ""; display: block; width: 18px; height: 18px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .add-btn.uploading::before { display: none; }

        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .book-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; display: flex; flex-direction: column; }
        .book-title { font-size: 1.2em; font-weight: bold; color: #2c3e50; margin-bottom: 10px; text-align: left; }
        .book-meta { color: #666; font-size: 0.9em; margin-bottom: 15px; text-align: left; }
        .btn { display: inline-block; background: #3498db; color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 0.9em; border: none; cursor: pointer; }
        .btn:hover { background: #2980b9; }
        .btn.btn-secondary { background: #f1f3f5; color: #495057; border: 1px solid #dee2e6; }
        .btn.btn-secondary:hover { background: #e9ecef; color: #212529; }
        .book-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }

        /* 上传提示 toast */
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 6px; color: white; font-family: -apple-system, sans-serif; font-size: 14px; z-index: 9999; opacity: 0; transform: translateY(-10px); transition: all 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
    </style>
</head>
<body>
    {% include 'scrollbar.html' %}
    <div class="container">
        <div class="header">
            <h1>书库</h1>
            <button class="add-btn" id="addBookBtn" title="导入 EPUB 或 TXT 书籍">+</button>
        </div>

        <!-- 隐藏的文件选择器 -->
        <input type="file" id="fileInput" accept=".epub,.txt" style="display: none;">

        <!-- Toast 提示 -->
        <div class="toast" id="toast"></div>

        {% if not books %}
            <p>No processed books found. Run <code>reader3.py</code> on an epub first, or click the + button to import one.</p>
        {% endif %}

        <div class="book-grid">
            {% for book in books %}
            <div class="book-card">
                <div class="book-title">{{ book.title }}</div>
                <div class="book-meta">
                    {{ book.author }}
                </div>
                <div class="book-actions">
                    <a href="/read/{{ book.id }}/0" class="btn">Read Book</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        const addBtn = document.getElementById('addBookBtn');
        const fileInput = document.getElementById('fileInput');
        const toast = document.getElementById('toast');

        // 点击加号 → 弹出文件选择对话框
        addBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择后自动上传
        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            // 显示上传中
            addBtn.classList.add('uploading');
            addBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const resp = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await resp.json();

                if (resp.ok && data.success) {
                    showToast(`《${data.title}》导入成功！`, 'success');
                    // 延迟刷新页面以显示新书
                    setTimeout(() => location.reload(), 1000);
                } else {
                    showToast(data.detail || '导入失败', 'error');
                }
            } catch (err) {
                showToast('上传失败: ' + err.message, 'error');
            } finally {
                addBtn.classList.remove('uploading');
                addBtn.disabled = false;
                fileInput.value = ''; // 允许重复选择同一文件
            }
        });

        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
