<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ book.metadata.title }} · Gnosys</title>
<link rel="stylesheet" href="/static/css/workspace.css">
{% include 'markdown_assets.html' %}
</head>
<body>
<header class="appbar">
 <a class="brand" href="/" aria-label="返回书库"><span class="brand-mark">G</span><span>Gnosys</span></a>
 <span class="bar-divider"></span><span id="book-title" class="book-name">{{ book.metadata.title }}</span>
 <div class="bar-actions"><button id="toggle-nav" aria-controls="navigation" aria-expanded="true">目录</button><button id="open-book-note">全书笔记</button><button id="toggle-panel" aria-controls="inspector" aria-expanded="true">Agent 与笔记</button><a href="/settings" title="Agent 配置">设置</a></div>
</header>
<div class="workspace">
 <aside id="navigation" class="navigation" aria-label="书籍导航">
  <div class="tabbar" role="tablist" aria-label="导航方式"><button role="tab" data-nav="outline" aria-selected="true">目录</button><button role="tab" data-nav="search" aria-selected="false">搜索</button><button role="tab" data-nav="bookmarks" aria-selected="false">书签</button></div>
  <div class="nav-caption" id="nav-caption">阅读目录</div>
  <form id="search-form" hidden><label class="sr-only" for="search-input">书内全文搜索</label><input id="search-input" type="search" placeholder="搜索书内文字…" maxlength="200"><button>搜索</button></form>
  <div id="nav-results" class="nav-results" role="tabpanel"></div>
  <footer class="nav-footer"><span id="chapter-counter"></span><span>本地书库</span></footer>
 </aside>
 <main id="reading" class="reading" aria-label="阅读正文">
  <div class="reading-toolbar">
   <div><button id="previous" aria-label="上一章">←</button><button id="next" aria-label="下一章">→</button><button id="add-bookmark">添加书签</button></div>
   <div class="reading-settings"><label>字号 <select id="font-size"><option>16</option><option selected>18</option><option>20</option><option>22</option><option>24</option></select></label><label>行距 <select id="line-height"><option>1.6</option><option selected>1.9</option><option>2.2</option></select></label></div>
  </div>
  <div id="reader-scroll" tabindex="0">
   <article id="chapter-view"><div class="eyebrow">READ & UNDERSTAND</div><h1 id="chapter-title">{{ chapter_title }}</h1>
   <div class="chapter-actions"><button id="open-chapter-note">章节笔记</button><button id="generate-semantic">生成本章语义解释</button><label class="muted"><input type="checkbox" id="show-semantic" checked> 段落旁注</label></div>
   <div id="chapter-content" aria-busy="true"><p class="muted">正在载入正文…</p></div><div class="chapter-end">本章结束</div></article>
  </div>
 </main>
 <aside id="inspector" class="inspector" aria-label="Agent 与阅读笔记">
  <div class="tabbar" role="tablist" aria-label="辅助阅读面板"><button role="tab" data-panel="chat" aria-selected="true">对话</button><button role="tab" data-panel="note" aria-selected="false">四层笔记</button><button role="tab" data-panel="runs" aria-selected="false">任务与待核稿</button></div>
  <section id="chat-panel" class="panel" role="tabpanel" aria-label="书籍对话">
   <div class="session-toolbar"><label class="sr-only" for="sessions">选择对话</label><select id="sessions"><option value="">选择或新建对话</option></select><button id="new-session" title="新建对话">新建</button><button id="rename-session" title="重命名对话">改名</button><button id="delete-session" title="删除对话">删除</button></div>
   <div id="messages" class="messages"><div class="empty-state"><span class="empty-mark">G</span><h2>从原文开始思考</h2><p>划选文字加入对话，或输入 @ 引用章、节、子节。每段讨论随书保存。</p></div></div>
   <div id="chat-status" class="status-line" role="status"></div>
   <div class="composer"><div id="reference-chips" class="reference-chips"></div><div id="mention-list" role="listbox" aria-label="章节自动补全" hidden></div>
    <label class="sr-only" for="chat-input">向阅读 Agent 提问</label><textarea id="chat-input" rows="3" placeholder="向这本书提问，输入 @ 引用章节…" aria-controls="mention-list" aria-autocomplete="list" aria-expanded="false"></textarea>
    <div class="composer-footer"><button id="export-chat">导出对话</button><span class="muted">Enter 发送 · Shift+Enter 换行</span><button id="stop-chat" hidden>停止</button><button id="send-chat" class="primary">发送</button></div>
   </div>
  </section>
  <section id="note-panel" class="panel" role="tabpanel" aria-label="四层阅读笔记" hidden>
   <div class="note-toolbar"><label>层级 <select id="note-layer"><option value="L1">全书层</option><option value="L2">章节层</option><option value="L3">语义层</option><option value="L4">概念层</option><option value="chat" hidden>对话摘记</option></select></label><button id="note-list-toggle">笔记列表</button></div>
   <div id="note-list" hidden></div><div class="note-target" id="note-target"></div>
   <div class="note-controls"><label>规范 <select id="agent-spec"><option value="general">通用规范</option><option value="hegel_helin">黑格尔贺麟译本</option></select></label><button id="generate-note" class="primary">AI 生成</button></div>
   <div class="note-controls"><button id="edit-note" aria-pressed="false">编辑</button><button id="save-note">保存</button><button id="export-note">导出 Markdown</button><span id="note-save-state" role="status"></span></div>
   <label class="sr-only" for="note-editor">笔记 Markdown</label><textarea id="note-editor" hidden spellcheck="false"></textarea><div id="note-preview" class="markdown note-preview"></div>
  </section>
  <section id="runs-panel" class="panel" role="tabpanel" aria-label="任务与待核稿" hidden><div class="note-toolbar"><span>生成进度与候选稿</span><button id="refresh-runs">刷新</button></div><div id="runs-list" class="runs-list"></div><div id="pending-list" class="runs-list"></div></section>
 </aside>
</div>
<div id="selection-actions" class="selection-actions" hidden><button id="selection-chat">加入对话</button><button id="selection-concept">解释概念</button><button id="selection-semantic">语义笔记</button></div>
<div id="toast" role="status" hidden></div>
<script>window.GNOSYS = {bookId: {{ book_id|tojson }}, chapter: {{ chapter_idx }}, total: {{ total_chapters }}, title: {{ book.metadata.title|tojson }}, noteMode: {{ note_mode|default(false)|tojson }}};</script>
<script src="/static/js/workspace.js" defer></script>
</body></html>
