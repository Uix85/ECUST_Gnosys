    }

    // ── 概念层：每词一独立弹窗（hover 显示 / 移开自动关闭 / 图钉锁定 / 点击置顶）──
    function initConceptMark(mark) {
        mark._locked = false;
        var term = mark.getAttribute('data-term') || '';
        mark._pop = createLayerPop(mark, {
            title: term,
            getLocked: function() { return mark._locked; },
            setLocked: function(v) { mark._locked = v; },
            onLock: function(v) { savePinState('concept', term, v); },
            clearTimer: function() { if (mark._cTimer) { clearTimeout(mark._cTimer); mark._cTimer = null; } },
            onLeave: function() { scheduleConceptClose(mark); },
            onContent: function(pop) { loadConceptContent(mark, pop); }
        });
        mark._pop.style.display = 'none';   // 初始隐藏，hover 时显示
        // 持久化锁定恢复：打开固定后翻页/刷新回来弹窗保持显现
        if (isPinLocked('concept', term)) {
            mark._locked = true;
            var pin = mark._pop.querySelector('.sp-pin');
            pin.classList.add('locked');
            pin.innerHTML = LOCK_ICON_PIN;
            showConceptPop(mark);
        }
    }
    async function loadConceptContent(mark, pop) {
        var term = mark.getAttribute('data-term') || '';
        try {
            var data = await layerGet('concept', 'term=' + encodeURIComponent(term));
            if (mark._pop !== pop) return;
            pop.querySelector('.sp-body').innerHTML = renderMarkdown(data.content || '（暂无内容）');
            // 选中即写入记忆：原文 + 段落锚点（content 由后端填充全书层文本）
            saveConceptMemo(term, mark.getAttribute('data-source') || term, mark.getAttribute('data-anchor') || '');
        } catch (err) { console.error('概念层请求失败', err); }
    }
    function showConceptPop(mark) {
        var pop = mark._pop;
        if (!pop) return;
        if (mark._cTimer) { clearTimeout(mark._cTimer); mark._cTimer = null; }
        positionConceptPop(pop, mark);
        pop.style.display = 'flex';
    }
    function scheduleConceptClose(mark) {
        var pop = mark._pop;
        if (!pop || mark._locked) return;
        if (mark._cTimer) clearTimeout(mark._cTimer);
        mark._cTimer = setTimeout(function() {
            if (mark._locked) return;
            pop.style.display = 'none';
        }, _popCloseDelay);
    }
    // 概念弹窗定位：根据当前布局在上下左右四个方向中选能完整放入可视区的位置
    // （优先右侧；放不下依次尝试左/下/上），全部放不下则 clamp 到可视区内。
    // 用户手动拖动过（pop._userPos）则保留手动位置，不再自动定位。
    function positionConceptPop(pop, mark) {
        if (pop._userPos) return;
        var view = document.getElementById('chapter-view');
        var vRect = view.getBoundingClientRect();
        var mRect = mark.getBoundingClientRect();
        var pw = pop.offsetWidth || 320;
        var ph = pop.offsetHeight || 400;
        var gap = 8;
        var mLeft = mRect.left - vRect.left;
        var mTop = mRect.top - vRect.top;
        var mBottom = mRect.bottom - vRect.top;
        var cands = [
            { l: mRect.right - vRect.left + gap, t: mTop - 6 },          // 右
            { l: mRect.left - vRect.left - pw - gap, t: mTop - 6 },      // 左
            { l: mLeft, t: mBottom + gap },                              // 下
            { l: mLeft, t: mTop - ph - gap },                            // 上
        ];
        var vw = view.clientWidth, vh = view.clientHeight;
        for (var i = 0; i < cands.length; i++) {
            var c = cands[i];
            if (c.l >= 0 && c.l + pw <= vw && c.t >= 0 && c.t + ph <= vh) {
                pop.style.left = c.l + 'px';
                pop.style.top = c.t + 'px';
                return;
            }
        }
        // 兜底：右优先，clamp 到可视区（顶部留出标题栏高度，避免被遮挡/裁剪）
        var l = Math.max(0, Math.min(mRect.right - vRect.left + gap, vw - pw));
        var t = Math.max(60, Math.min(mTop - 6, vh - ph - 8));
        pop.style.left = l + 'px';
        pop.style.top = t + 'px';
    }

    // ── 悬停委托：概念 mark（弹窗独立于解释笔开关，mark 存在即响应）──
    document.addEventListener('mouseover', function(e) {
        var m = e.target.closest ? e.target.closest('mark.concept-hl') : null;
        if (m) showConceptPop(m);
    });
    document.addEventListener('mouseout', function(e) {
        var m = e.target.closest ? e.target.closest('mark.concept-hl') : null;
        if (m) scheduleConceptClose(m);
    });

    // ── 选中高亮 ──
    document.getElementById('ch-content').addEventListener('mouseup', function(e) {
        if (!CONCEPT_ON) return;
        if (e.target.closest && (e.target.closest('mark') || e.target.closest('.semantic-pop'))) return;
        setTimeout(applyHighlight, 0);
    });

    function applyHighlight() {
        var sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
        var range = sel.getRangeAt(0);
        var content = document.getElementById('ch-content');
        if (!content.contains(range.commonAncestorContainer)) return;
        var text = sel.toString().trim();
        if (text.length < 1 || text.length > 2000) return;   // 过短不处理；上限 2000 防误选整页
        // 跨段选区不处理：inline <mark> 无法合法包裹块级元素（<p>/<div>），
        // extractContents 降级会生成被浏览器拆分的无效 DOM → 正文空白
        if (rangeCrossesBlocks(range, content)) return;
        var kind = auxClassify(text);   // 现况恒为 'concept'
        var mark = document.createElement('mark');
        mark.className = 'concept-hl';
        mark.setAttribute('data-term', text);
        mark.setAttribute('data-kind', kind);
        try {
            range.surroundContents(mark);
        } catch (err) {
            // 选区部分跨越子元素（脚注 <sup> / 链接 <a> 等）时 surroundContents 抛
            // HierarchicalRequestError → 降级：extractContents 拆解后手动包裹
            try {
                var frag = range.extractContents();
                mark.appendChild(frag);
                range.insertNode(mark);
            } catch (err2) { return; }
        }
        sel.removeAllRanges();
        // 记录原文与所在段落前缀（记忆持久化：换章/离开后回来据此恢复高亮）
        mark.setAttribute('data-source', text);
        mark.setAttribute('data-anchor', paraPrefixOf(mark));
        initConceptMark(mark);   // 概念：每词一独立弹窗（hover 显示）；记忆由 loadConceptContent 写入
    }

    // 选区是否跨越多个块级元素（段落级）：inline <mark> 只能包裹同一块内的内容
    function rangeCrossesBlocks(range, content) {
        function blockOf(node) {
            var el = (node.nodeType === 1) ? node : node.parentNode;
            while (el && el !== content && el !== document.body) {
                var t = el.tagName;
                if (t === 'P' || t === 'DIV' || t === 'H1' || t === 'H2' || t === 'H3' ||
                    t === 'H4' || t === 'H5' || t === 'H6' || t === 'LI' || t === 'BLOCKQUOTE' ||
                    t === 'SECTION' || t === 'TR') return el;
                el = el.parentNode;
            }
            return null;
        }
        var sb = blockOf(range.startContainer);
        var eb = blockOf(range.endContainer);
        if (sb && eb) return sb !== eb;
        // 任一端定位不到块（悬在 content 直接子级）→ 保守按跨段处理
        return range.startContainer !== range.endContainer;
    }

    // ── 弹窗拉伸（共享管理器，无大小边界）──
    document.addEventListener('mousemove', function(e) {
        if (_popDrag) {
            var d = _popDrag;
            d.pop.style.left = (d.lx + e.clientX - d.sx) + 'px';
            d.pop.style.top = (d.ty + e.clientY - d.sy) + 'px';
            return;
        }
        if (_popResize) {
            var r = _popResize;
            r.pop.style.width = (r.sw + e.clientX - r.sx) + 'px';
            r.pop.style.height = (r.sh + e.clientY - r.sy) + 'px';
        }
    });
    document.addEventListener('mouseup', function() {
        if (_popDrag) {
            _popDrag.pop.classList.remove('dragging');
            _popDrag = null;
        }
        if (_popResize) { _popResize = null; document.body.style.cursor = ''; }
    });

    // ── 记忆写入（选中即缓存 → layer 表；content 缺省时后端自动填充全书层文本）──
    function saveConceptMemo(term, sourceText, anchorText) {
        fetch('/api/layer/concept/' + BOOK_ID, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ term: term, content: '', source_text: sourceText || term, anchor_text: anchorText || '' })
        }).then(function(r) { if (r.ok) _conListCache = null; })   // 记忆更新 → 缓存失效，下次恢复重新拉取
          .catch(function() {});
    }



    // ── 换到全新章：旧章弹窗已随 stash 移入缓存容器（不销毁），
    // 这里只需重置章节级状态（防重集合）──
    function prepareNewChapter() {
        _restoredSources = {};   // 新章节内容需重新恢复，清空防重集合
    }

    // ── 缓存切回某章后：概念弹窗按新布局重新定位（滚动跟随用）──
    function reposition() {
        document.querySelectorAll('#ch-content mark.concept-hl').forEach(function(m) {
            if (m._pop && m._pop.style.display !== 'none' && !m._pop._userPos) {
                positionConceptPop(m._pop, m);
            }
        });
    }

    // ── 从当前章 DOM 中现存的概念 mark 重建弹窗（缓存切回用）──
    // mark 始终在正文里；切走时弹窗被销毁，切回后据 mark 重建，
    // 保证它们锚定 mark：页内滚动天然跟随，页跳转后位置也正确。
    function restoreFromDom() {
        document.querySelectorAll('#ch-content mark.concept-hl').forEach(function(m) {
            initConceptMark(m);
        });
    }

    // ── 滚动跟随：概念弹窗锚定 mark 实时移动（未拖动时随 mark 走）──
    var _reposRaf = null;
    mainEl.addEventListener('scroll', function() {
        if (_reposRaf) return;
        _reposRaf = requestAnimationFrame(function() {
            _reposRaf = null;
            reposition();
        });
    }, { passive: true });

    // ═══════════════════════════════════════════════════════
    // 记忆恢复：先记录后识别 —— 选中时已把原文(source_text)和所在段落前缀
    // (anchor_text) 写入 layer 表；离开/换章/刷新后回来，据此在当前章正文中
    // 重新定位并恢复概念高亮 mark，保证记忆不丢失。
    // ═══════════════════════════════════════════════════════
    function paraPrefixOf(el) {
        var content = document.getElementById('ch-content');
        var node = el;
        while (node && node !== content && node !== document.body) {
            if (node.nodeType === 1 && /^(P|DIV|H1|H2|H3|H4|H5|H6|LI|BLOCKQUOTE)$/.test(node.tagName)) break;
            node = node.parentNode;
        }
        if (!node || node === document.body) return '';
        return (node.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    }

    // 在容器内按原文匹配并包裹 mark（单文本节点内；跨节点暂跳过，避免破坏正文 DOM）
    function wrapMarkIn(container, text) {
        if (!text) return null;
        var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        var nodes = [], offsets = [], full = '', n;
        while ((n = walker.nextNode())) { nodes.push(n); offsets.push(full.length); full += n.textContent; }
        var idx = full.indexOf(text);
        if (idx < 0) return null;
        var endIdx = idx + text.length;
        var si = -1, so = 0, ei = -1, eo = 0;
        for (var i = 0; i < nodes.length; i++) {
            var s = offsets[i], e = offsets[i] + nodes[i].textContent.length;
            if (si < 0 && idx >= s && idx <= e) { si = i; so = idx - s; }
            if (ei < 0 && endIdx >= s && endIdx <= e) { ei = i; eo = endIdx - s; }
        }
        if (si < 0 || ei < 0 || si !== ei) return null;   // 跨文本节点（粗体/斜体分隔）暂跳过
        var tn = nodes[si];
        var before = document.createTextNode(tn.textContent.slice(0, so));
        var mid = document.createTextNode(tn.textContent.slice(so, eo));
        var after = document.createTextNode(tn.textContent.slice(eo));
        var mark = document.createElement('mark');
        mark.className = 'concept-hl';
        mark.setAttribute('data-term', text);
        mark.setAttribute('data-kind', 'concept');
        mark.setAttribute('data-source', text);
        mark.appendChild(mid);
        var parent = tn.parentNode;
        parent.replaceChild(after, tn);
        parent.insertBefore(mark, after);
        parent.insertBefore(before, mark);
        return mark;
    }

    function restoreOne(content, item) {
        var source = item.source_text || item.term;
        if (!source) return;
        if (!content.isConnected) return;          // 内容已被换章替换 → 跳过（防孤儿弹窗）
        if (_restoredSources[source]) return;      // 已恢复过 → 跳过（防重复包裹）
        var anchor = (item.anchor_text || '').replace(/\s+/g, ' ');
        // 优先按段落锚点定位到原段落（避免短词条全书误标）
        var target = null;
        if (anchor) {
            var paras = content.querySelectorAll('p, div, h1, h2, h3, h4, h5, h6, li, blockquote');
            for (var i = 0; i < paras.length; i++) {
                if ((paras[i].textContent || '').replace(/\s+/g, ' ').indexOf(anchor) >= 0) {
                    target = paras[i]; break;
                }
            }
        }
        if (!target) return;   // 锚点不在本章 → 短词条不全书匹配，避免误标
        var mark = wrapMarkIn(target, source);
        if (mark) {
            _restoredSources[source] = true;
            // 补齐锚点：恢复的 mark 也带 data-anchor，弹窗保存时不会把 DB 锚点覆盖成空
            mark.setAttribute('data-anchor', paraPrefixOf(mark));
            initConceptMark(mark);   // 恢复弹窗（hover 显示）
        }
    }

    // 拉取概念列表（带缓存：书未变则首次拉取后复用，换章不重复请求）
    async function _getConItems() {
        if (!_conListCache) {
            var r = await fetch('/api/layer/concept_list/' + BOOK_ID);
            _conListCache = (await r.json()).items || [];
        }
        return _conListCache;
    }

    async function restoreHighlights() {
        var content = document.getElementById('ch-content');
        if (!content || !content.isConnected) return;   // 内容已被替换则跳过
        try {
            var con = await _getConItems();
            for (var i = 0; i < con.length; i++) restoreOne(content, con[i]);
        } catch (e) { console.error('恢复高亮失败', e); }
    }

    return {
        prepareNewChapter: prepareNewChapter,
        restoreFromDom: restoreFromDom,
        restore: restoreHighlights,
    };
})();

// ═══════════════════════════════════════════════════════
// 语义层（段落级备注栏）—— 独立 IIFE 模块 SemMargin
// 每段一条语义解释：右栏灰字简短解释（顶端对齐段落顶部）。
// 点击简短解释 → 展开「整段详细解释 + 逐句解释」；悬停逐句解释 → 正文对应句高亮；
// 与下一条解释临界处灰线截断，悬停浮现剩余内容，鼠标移开复原。
// 数据：/api/layer/para_semantic/{book_id}?chapter={idx}（source_text=段落原文，服务端按该章过滤），
// 前端按规范化原文匹配正文段落（正文段落 = 叶子块元素按 <br> 切分）。
// ═══════════════════════════════════════════════════════
var activeAgentRunId = null;
var activeAgentStream = null;
var activeAgentEventText = '';

function agentRunUrl(suffix) {
    return '/api/agent/' + encodeURIComponent(BOOK_ID) + '/runs' + (suffix || '');
}
function setAgentMessage(text) {
    var panel = document.getElementById('agent-run-panel');
    if (!panel) return;
    panel.style.display = text ? 'block' : 'none';
    document.getElementById('agent-run-text').textContent = text || '';
}
function showAgentRun(runId) {
    activeAgentRunId = runId;
    if (activeAgentStream) activeAgentStream.close();
    if (!runId) return;
    fetch(agentRunUrl('/' + encodeURIComponent(runId))).then(function(r) { return r.json(); }).then(function(run) {
        showAgentRunSnapshot(runId, run);
        if (['queued','running','canceling'].indexOf(run.status) >= 0) {
            activeAgentStream = new EventSource(agentRunUrl('/' + encodeURIComponent(runId) + '/events'));
            activeAgentStream.addEventListener('update', function(ev) {
                try { var data = JSON.parse(ev.data); activeAgentEventText = data.message || data.stage || ''; } catch (_) {}
                showAgentRunSnapshot(runId);
            });
            activeAgentStream.addEventListener('end', function() {
                if (activeAgentStream) activeAgentStream.close();
                activeAgentStream = null;
                showAgentRunSnapshot(runId);
                if (typeof SemMargin !== 'undefined') SemMargin.refresh();
            });
        }
    }).catch(function(e) { setAgentMessage('读取任务状态失败：' + e); });
}
function showAgentRunSnapshot(runId, loaded) {
    var request = loaded ? Promise.resolve(loaded) : fetch(agentRunUrl('/' + encodeURIComponent(runId))).then(function(r) { return r.json(); });
    request.then(function(run) {
        var c = run.counts || {}, total = run.tasks ? run.tasks.length : 0;
        var pending = (c.pending || 0) + (c.conflict || 0), failed = c.failed || 0;
        var firstError = (run.tasks || []).find(function(task) { return task.error; });
        setAgentMessage('任务 ' + run.status + ' · 已完成 ' + (c.published || 0) + '/' + total + ' · 待核 ' + pending + ' · 失败 ' + failed + (firstError ? ' · 原因：' + firstError.error.slice(0, 120) : '') + (activeAgentEventText ? ' · ' + activeAgentEventText : ''));
        document.getElementById('agent-pending-toggle').style.display = pending ? '' : 'none';
        var retryable = failed + pending + (c.canceled || 0) + (c.interrupted || 0);
        document.getElementById('agent-retry').style.display = ['failed','needs_review','interrupted','canceled'].indexOf(run.status) >= 0 && retryable ? '' : 'none';
        document.getElementById('agent-cancel').style.display = ['queued','running','canceling'].indexOf(run.status) >= 0 ? '' : 'none';
    });
}
function submitAgentRun(body, button) {
    var original = button ? (button.dataset.originalText || button.textContent) : '';
    if (button) { button.dataset.originalText = original; button.disabled = true; button.textContent = '正在排队…'; }
    setAgentMessage('正在统计并排队段落…');
    fetch(agentRunUrl(''), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
        .then(function(r) { return r.json().then(function(data) { if (!r.ok) throw new Error(data.detail && data.detail.message || data.detail || r.statusText); return data; }); })
        .then(function(data) {
            if (!data.id) { setAgentMessage(data.status === 'nothing_to_do' ? '当前范围没有待生成段落。' : '没有新任务。'); return; }
            activeAgentEventText = data.existing ? '已找到正在运行的相同段落任务' : '预计处理 ' + data.estimated_count + ' 段';
            showAgentRun(data.id);
        }).catch(function(error) { setAgentMessage('启动失败：' + error.message); })
        .finally(function() { if (button) { button.disabled = false; button.textContent = original; } });
}
function createParagraphRun(chapterIdx, paragraphIndex, button) {
    submitAgentRun({paragraph_ref:{chapter_idx:chapterIdx,paragraph_index:paragraphIndex},mode:document.getElementById('agent-mode').value,spec_type:document.getElementById('agent-spec').value}, button);
}
function createChapterRun() {
    var button = document.querySelector('#agent-controls button');
    submitAgentRun({chapter_idx:currentChapter,mode:document.getElementById('agent-mode').value,spec_type:document.getElementById('agent-spec').value}, button);
}
function cancelAgentRun() {
    if (!activeAgentRunId) return;
    fetch(agentRunUrl('/' + encodeURIComponent(activeAgentRunId) + '/cancel'), {method:'POST'}).then(function() { activeAgentEventText = '已请求取消'; showAgentRunSnapshot(activeAgentRunId); });
}
function retryAgentRun() {
    if (!activeAgentRunId) return;
    fetch(agentRunUrl('/' + encodeURIComponent(activeAgentRunId) + '/retry'), {method:'POST'}).then(function(r) { return r.json().then(function(x) { if (!r.ok) throw new Error(x.detail || r.statusText); return x; }); }).then(function(x) { if (x.id) showAgentRun(x.id); }).catch(function(e) { setAgentMessage('重试失败：' + e.message); });
}
function toggleAgentPending() {
    var box = document.getElementById('agent-pending-list');
    if (box.style.display === 'block') { box.style.display = 'none'; return; }
    box.style.display = 'block'; box.textContent = '正在读取待核稿…';
    fetch(agentRunUrl('/pending')).then(function(r) { return r.json(); }).then(function(data) {
        box.textContent = '';
        (data.items || []).forEach(function(item) {
            var row = document.createElement('div'); row.className = 'agent-pending-item';
            var title = document.createElement('strong'); title.textContent = '第 ' + (item.chapter_idx + 1) + ' 章 · 段落 ' + (item.paragraph_index + 1) + ' · ' + item.state; row.appendChild(title);
            var source = document.createElement('pre'); source.textContent = '原文：' + item.source_text + '\n\n简短解释：' + item.short + '\n\n具体解释：' + item.detail + '\n\n复核：' + JSON.stringify(item.review || {}, null, 2); row.appendChild(source);
            var adopt = document.createElement(item.state === 'conflict' ? 'span' : 'button');
            if (item.state === 'conflict') { adopt.textContent = '原文或已有解释已变更；请重新生成或手动处理此候选稿。'; }
            else { adopt.type = 'button'; adopt.textContent = '采纳并发布'; }
            adopt.onclick = item.state === 'conflict' ? null : function() {
                adopt.disabled = true;
                fetch(agentRunUrl('/' + encodeURIComponent(item.run_id) + '/adopt'), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:item.task_id})})
                    .then(function(r) { return r.json().then(function(x) { if (!r.ok) throw new Error(x.detail || r.statusText); return x; }); })
                    .then(function() { row.remove(); if (typeof SemMargin !== 'undefined' && item.chapter_idx === currentChapter) SemMargin.refresh(); })
                    .catch(function(e) { adopt.disabled = false; setAgentMessage('采纳失败：' + e.message); });
            }; row.appendChild(adopt); box.appendChild(row);
        });
        if (!data.items || !data.items.length) box.textContent = '当前没有待核稿。';
    }).catch(function(e) { box.textContent = '读取失败：' + e.message; });
}
function restoreAgentRunState() {
    fetch(agentRunUrl('')).then(function(r) { return r.json(); }).then(function(data) {
        var items = data.items || [];
        var run = items.find(function(x) { return ['queued','running','canceling'].indexOf(x.status) >= 0; }) || items.find(function(x) { return ['needs_review','failed','interrupted','canceled'].indexOf(x.status) >= 0; });
        if (run) showAgentRun(run.id);
    }).catch(function() {});
}

var SemMargin = (function() {
    var GAP = 10;        // 与下一条解释的间隔（临界位置）
    var MIN_H = 40;      // 截断时至少保留的高度
    var NOTE_W = 300;    // 简短解释目标宽度
    var NOTE_MIN = 120;  // 备注栏可压缩的最小宽度
    var TEXT_MAX = 700;  // 正文列最大宽（与 CSS 一致）
    var TEXT_MIN = 340;  // 正文列可压缩的最小宽度
    var DETAIL_W = 384;                   // 具体解释两栏总宽（左「整段详细解释」约占 38%，右「逐句解释」为余下约 62%）
    var STACK_DETAIL = false;             // true = 具体解释固定“详细在上、逐句在下”（两栏放不下时自动如此）
    var BLOCK_SEL = 'p, div, h1, h2, h3, h4, h5, h6, li, blockquote';
    var _items = null;   // 当前章条目
    var _cache = {};     // 章索引 → 该章条目（每章一次拉取，换回不重复请求）
    var _byNorm = {};    // 规范化段落原文 → 条目
    var _byPosition = {}; // 逻辑章 + 段落序号 → 条目
    var _open = null;    // 当前展开为详细解释的备注

    function normText(t) {
        return (t || '').normalize('NFKC').replace(/\s+/g, '').toLowerCase();
    }

    // ── 是否需要解释：标题 / 页眉 / 书目行等不挂解释 ──
    // 判据（在《精神现象学》1738 段上实测：判出 312 段不需要，均为标题/书目行，未误杀正文）：
    // ① 规范化后不足 25 字（如「第二章　知覉；事物和幻觉」「［一、事物的简单概念］」）
    // ② 没有句末标点（中文 。！？ / 西文 .!?）——标题、目录、书目行都没有
    // ③ 行首为目录式序号（第X章 / 一、 / （1））
    var HEADING_RE = /^[\[［【(（]?(第[一二三四五六七八九十百零两0-9]+[章节篇部分卷]|[一二三四五六七八九十]+[、．.]|[0-9]+[、．.)）])/;
    // ③ 只在“标题那么短”时才按行首序号排除：有的书把章标题与正文粘成一段
    //    （如《江村经济》「第一章：前 言　　这是一本描述…」），只看开头会把整段正文误判成标题
    var HEADING_MAX = 60;   // 规范化长度超过此值就不再按“标题开头”排除
    function needsNote(text) {
        var t = (text || '').trim();
        var n = normText(t);
        if (n.length < 25) return false;
        var term = /[\u4e00-\u9fff]/.test(t) ? /[。！？]/ : /[.!?]/;
        if (!term.test(t)) return false;
        if (n.length <= HEADING_MAX && HEADING_RE.test(n)) return false;
        return true;
    }

    function indexByNorm(items) {
        _byNorm = {};
        _byPosition = {};
        items.forEach(function(it) {
            var n = normText(it.source_text);
            if (n) _byNorm[n] = it;
            if (typeof it.chapter_idx === 'number' && typeof it.paragraph_index === 'number')
                _byPosition[it.chapter_idx + ':' + it.paragraph_index] = it;
        });
    }

    // 拉该章条目（?chapter=阅读器章索引，服务端按该章正文过滤）；失败则本次无备注
    async function ensureData(chidx) {
        var items = _cache[chidx];
        if (!items) {
            items = [];
            try {
                var r = await fetch('/api/layer/para_semantic/' + encodeURIComponent(BOOK_ID) + '?chapter=' + chidx);
                items = ((await r.json()).items) || [];
            } catch (e) { console.error('语义层（段落级）请求失败：', e); }
            _cache[chidx] = items;
        }
        _items = items;
        indexByNorm(items);
        return items;
    }

    // ── 正文段落切分：块元素按 <br> 切成逻辑段落（txt 书整章是一个 <p> + 多个 <br>）──
    function segmentsOf(block) {
        var segs = [], cur = [];
        function flush() {
            if (cur.length) {
                var text = cur.map(function(n) { return n.textContent; }).join('');
                var norm = normText(text);
                if (norm) segs.push({ nodes: cur, text: text, norm: norm });
            }
            cur = [];
        }
        Array.prototype.slice.call(block.childNodes).forEach(function(node) {
            if (node.nodeType === 1 && node.tagName === 'BR') { flush(); return; }
            cur.push(node);
        });
        flush();
        return segs;
    }

    // ── 匹配并挂备注：命中的段落包进 .sem-para（相对定位块）──
    function attach() {
        var content = document.getElementById('ch-content');
        if (!content || !content.isConnected || !_items) return;
        var wraps = [], paragraphIndex = 0;
        Array.prototype.forEach.call(content.querySelectorAll(BLOCK_SEL), function(block) {
            if (block.dataset.semDone === '1') return;
            if (block.querySelector(BLOCK_SEL)) return;   // 非叶子块：交给内部块级元素处理
            var segments = segmentsOf(block);
            segments.forEach(function(s) { s.paragraphIndex = paragraphIndex++; });
            var hit = segments.filter(function(s) { return needsNote(s.text); });
            if (!hit.length) return;
            block.dataset.semDone = '1';
            hit.forEach(function(s) {
                var wrap = document.createElement('span');
                wrap.className = 'sem-para';
                wrap.dataset.agentChapter = currentChapter;
                wrap.dataset.agentParagraph = s.paragraphIndex;
                block.insertBefore(wrap, s.nodes[0]);
                s.nodes.forEach(function(n) { wrap.appendChild(n); });
                dropOneBr(wrap);   // 段内换行改由块级段包提供，去掉多余的一个 <br>
                wrap._item = _byPosition[currentChapter + ':' + s.paragraphIndex] || _byNorm[s.norm];
                if (wrap._item) { buildNote(wrap); wraps.push(wrap); }
                else buildGenerate(wrap, currentChapter, s.paragraphIndex);
            });
        });
        layout();
    }

    function buildGenerate(wrap, chapterIdx, paragraphIndex) {
        var slot = document.createElement('span');
        slot.className = 'sem-generate';
        var button = document.createElement('button');
        button.type = 'button'; button.textContent = '生成解释'; button.dataset.originalText = button.textContent;
        button.title = '为这一段生成语义解释';
        button.onclick = function(e) { e.preventDefault(); e.stopPropagation(); createParagraphRun(chapterIdx, paragraphIndex, button); };
        slot.appendChild(button); wrap.appendChild(slot);
    }

    // ── 段包把段落变成块级后，原来负责换行的 <br> 会渲染成一个空行（前后段距离被拉开）──
    // 去掉紧邻的一个 <br>（跳过空白文本节点），把段落间距恢复成原文的，不多不少。
    // 相邻还有 <br>（原文的空行）则保留，故变窄而非变密。
    function adjacentBr(el, dir) {
        for (var n = dir > 0 ? el.nextSibling : el.previousSibling; n;) {
            if (n.nodeType === 1 && n.tagName === 'BR') return n;
            if (n.nodeType === 3 && !n.textContent.trim()) { n = dir > 0 ? n.nextSibling : n.previousSibling; continue; }
            return null;
        }
        return null;
    }
    function dropOneBr(wrap) {
        var br = adjacentBr(wrap, 1) || adjacentBr(wrap, -1);
        if (br) br.remove();
    }

    function buildNote(wrap) {
        var note = document.createElement('span');
        note.className = 'sem-note';
        note._wrap = wrap;
        note._item = wrap._item;
        setShort(note);
        note.addEventListener('mouseenter', function() { note.classList.add('revealed'); });
        note.addEventListener('mouseleave', function() {
            note.classList.remove('revealed');
            note.classList.remove('loose');
            clearSentenceHL(wrap);
            if (note._mode === 'detail') showShort(note);   // 移开具体解释区域 → 回到简短解释
        });
        note.addEventListener('click', function(e) {
            e.stopPropagation();                       // 阻止冒泡到“点击别处收起”
            if (note._mode === 'short') showDetail(note);
        });
        wrap._note = note;
        wrap.appendChild(note);
    }

    function setShort(note) {
        var s = document.createElement('span');
        s.className = 'sn-short';
        s.textContent = note._item.short || '';
        note.textContent = '';
        note.appendChild(s);
        note.classList.remove('revealed');
        note._mode = 'short';
    }

    function showDetail(note) {
        var it = note._item;
        var d = document.createElement('span');
        d.className = 'sn-detail';
        var left = document.createElement('span');
        left.className = 'sn-left';
        left.textContent = it.detail || '';
        var right = document.createElement('span');
        right.className = 'sn-right';
        var nSen = wrapSentences(note._wrap);   // 正文分句（悬停高亮用），返回句数
        note._loose = (nSen !== (it.sentences || []).length);   // 位数不吻合 → 不逐句指位
        (it.sentences || []).forEach(function(txt, i) {
            if (!(txt || '').trim()) return;   // 素平句无解释 → 不生成条目（编号仍对齐）
            var item = document.createElement('span');
            item.className = 'sn-item';
            item.setAttribute('data-si', i);
            item.textContent = (nSen > 1 ? (i + 1) + '. ' : '') + txt;
            item.addEventListener('mouseenter', function() { setSentenceHL(note._wrap, i, true, note._loose); });
            item.addEventListener('mouseleave', function() { setSentenceHL(note._wrap, i, false, note._loose); });
            right.appendChild(item);
        });
        d.appendChild(left);
        d.appendChild(right);
        note.textContent = '';
        note.appendChild(d);
        note._mode = 'detail';
        _open = note;
        if (note._loose) note.classList.add('loose');
        layout();
    }

    function showShort(note) {
        setShort(note);
        if (_open === note) _open = null;
        layout();
    }

    // 点击别处 → 收起为简短解释（鼠标移开同样收起，两道保险）
    document.addEventListener('click', function() {
        if (_open) showShort(_open);
    });

    // ── 正文分句：按 。！？ 断句（吸收尾随引号/括号），跨文本节点的句子共用句序 ──
    var SENT_END = /[。！？.!?]/;
    var TAIL = /[”』」）)]/;
    function splitSentences(text) {
        var out = [], cur = '';
        for (var i = 0; i < text.length; i++) {
            cur += text[i];
            if (SENT_END.test(text[i])) {
                while (i + 1 < text.length && TAIL.test(text[i + 1])) cur += text[++i];
                out.push(cur);
                cur = '';
            }
        }
        if (cur) out.push(cur);
        return out;
    }

    var SENT_TAIL = /[。！？.!?][”』」）)]*$/;   // 句末（含尾随引号/括号）才是“这一句结束”
    function wrapSentences(wrap) {
        if (wrap._sentDone) return wrap._senCount;
        wrap._sentDone = true;
        var walker = document.createTreeWalker(wrap, NodeFilter.SHOW_TEXT, null);
        var nodes = [], n;
        while ((n = walker.nextNode())) {
            var p = n.parentNode;
            if (p && p.closest && p.closest('.sem-note')) continue;   // 备注自身不参与分句
            if (n.textContent) nodes.push(n);
        }
        // 句序按“已收尾的句数”推进：同一句被 <mark> 等拆到多个文本节点时各片段共用同一序号，
        // 上一个节点末句已收尾则下一节点接下一句（否则会两句话同号、句数少算 → 精确指位失效）
        var count = 0, lastEnded = true;
        nodes.forEach(function(tn) {
            var parts = splitSentences(tn.textContent);
            if (!parts.length) return;
            var frag = document.createDocumentFragment();
            parts.forEach(function(txt) {
                // 首尾空白（段首缩进、段末换行）一律留在 span 之外：高亮只作用于文字本身，
                // 不管缩进是粘在第一句里还是单独的空白节点，表现都一致
                var lead = txt.match(/^\s+/);
                if (lead) { frag.appendChild(document.createTextNode(lead[0])); txt = txt.slice(lead[0].length); }
                var tail = txt.match(/\s+$/);
                if (tail) txt = txt.slice(0, txt.length - tail[0].length);
                if (txt) {
                    var sp = document.createElement('span');
                    sp.className = 'sem-sen';
                    sp.setAttribute('data-si', count);
                    sp.textContent = txt;
                    frag.appendChild(sp);
                    lastEnded = SENT_TAIL.test(txt);
                    if (lastEnded) count++;
                }
                if (tail) frag.appendChild(document.createTextNode(tail[0]));
            });
            tn.parentNode.replaceChild(frag, tn);
        });
        var allText = nodes.map(function(node) { return node.textContent; }).join('').replace(/\s+$/, '');
        lastEnded = SENT_TAIL.test(allText);
        if (count > 0 && !lastEnded) count++;   // 末尾这句没有句末标点，也算一句
        wrap._senCount = count;
        return count;
    }

    // 悬停逐句解释 → 高亮正文对应句；位数不吻合（_loose）时只淡提示整段，不指错句。
    // 高亮同时把该句滚进可视区（备注比段落长时，目标句可能在屏外）。
    function setSentenceHL(wrap, si, on, loose) {
        var els = loose
            ? Array.prototype.slice.call(wrap.querySelectorAll('.sem-sen'))
            : Array.prototype.slice.call(wrap.querySelectorAll('.sem-sen[data-si="' + si + '"]'));
        if (!els.length) return;
        els.forEach(function(el) {
            el.classList.toggle('sem-sen-hl', on && !loose);
            el.classList.toggle('sem-sen-loose', on && loose);
        });
        if (on && !loose) els[0].scrollIntoView({ block: 'nearest' });
    }

    function clearSentenceHL(wrap) {
        Array.prototype.forEach.call(wrap.querySelectorAll('.sem-sen-hl, .sem-sen-loose'), function(el) {
            el.classList.remove('sem-sen-hl');
            el.classList.remove('sem-sen-loose');
        });
    }

    // ── 截断：每条解释只占到“下一条解释顶端”前（临界处画灰线）；
    // 悬停/展开时浮现全部内容（z-index 抬升，覆盖下方解释）──
    // ── 备注首行与段落首行的“文字顶部”对齐 ──
    // 段落 1.8 行高 + serif、备注 1.55 行高 + sans，只靠 top:0（盒顶对齐）看起来会差几像素，
    // 所以逐个量：段落首个可见字符的盒顶 − 备注首字符的盒顶 = 该下移的量。
    // 无布局环境（如测试）量不到就清掉 inline top，回落到 CSS 的 top:.28em。
    function firstCharTop(el, skipNotes) {
        var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = walker.nextNode())) {
            if (!n.textContent || !n.textContent.trim()) continue;
            var p = n.parentNode;
            if (skipNotes && p && p.closest && p.closest('.sem-note')) continue;   // 段落量测时跳过备注自身文本
            var i = n.textContent.search(/\S/);
            if (i < 0) continue;
            try {
                var r = document.createRange();
                r.setStart(n, i);
                r.setEnd(n, Math.min(n.textContent.length, i + 1));
                var rect = r.getBoundingClientRect();
                if (rect && (rect.height || rect.width)) return rect.top;
            } catch (e) { return null; }
        }
        return null;
    }

    function layout() {
        var content = document.getElementById('ch-content');
        if (!content || !content.isConnected) return;
        // ── 列宽自适应（目录栏拉宽时备注栏不会被推到屏外）──
        // 正文列在 [TEXT_MIN, TEXT_MAX] 内让宽；优先留出备注栏的最小宽度，
        // 备注栏再在 [NOTE_MIN, 目标宽] 内吃掉剩余空间。
        var cv = document.getElementById('chapter-view');
        var mainW = mainEl.clientWidth || 0;
        var cvLeft = cv.getBoundingClientRect().left - mainEl.getBoundingClientRect().left;   // 含左边距
        var room = mainW - cvLeft - 80;                                   // 扣掉正文左右 padding
        var textW = Math.max(TEXT_MIN, Math.min(TEXT_MAX, room - 28 - NOTE_MIN));
        if (Math.abs((parseFloat(cv.style.width) || 0) - textW) > 0.5) cv.style.width = textW + 'px';
        var availNote = Math.max(0, mainW - cvLeft - textW - 76);         // 备注左缘（正文右缘+28）到 main 右缘

        var wraps = [];
        Array.prototype.forEach.call(content.querySelectorAll('.sem-para'), function(w) {
            if (w._note) wraps.push(w);
        });
        wraps.sort(function(a, b) { return a.getBoundingClientRect().top - b.getBoundingClientRect().top; });

        // 读阶段：先算好每条备注要下移多少（读写分开，避免逐条读改引发布局抖动）
        var tops = wraps.map(function(w) {
            var pTop = firstCharTop(w, true);
            var nTop = firstCharTop(w._note, false);
            return (pTop === null || nTop === null) ? null : (pTop - nTop);
        });

        wraps.forEach(function(w, i) {
            var note = w._note;
            note.classList.remove('clipped');
            note.style.maxHeight = '';
            if (tops[i] !== null) note.style.top = tops[i].toFixed(1) + 'px';   // 首行文字顶端对齐对应段
            else note.style.top = '';                                           // 量不到 → 回落到 CSS 兜底值
            var target = (note._mode === 'detail') ? DETAIL_W : NOTE_W;
            note.style.width = Math.min(target, Math.max(NOTE_MIN, availNote)) + 'px';
            note.classList.toggle('stacked', note._mode === 'detail' && (STACK_DETAIL || availNote < DETAIL_W));
            var next = wraps[i + 1];
            if (!next) return;   // 最后一条：下方无解释，无需截断
            var limit = next.getBoundingClientRect().top - w.getBoundingClientRect().top - GAP;
            if (limit < MIN_H) limit = MIN_H;
            if (note.scrollHeight > limit) {
                note.style.maxHeight = limit + 'px';
                note.classList.add('clipped');
            }
        });
    }

    var _rzTimer = null;
    window.addEventListener('resize', function() {
        clearTimeout(_rzTimer);
        _rzTimer = setTimeout(layout, 200);
    });

    // 换章/回到已访问章后调用：拉该章数据 + 挂备注
    async function afterChapter() {
        _open = null;   // 旧章备注可能已进缓存，不保留展开态
        await ensureData(currentChapter);
        attach();
    }

    async function refresh() {
        var content = document.getElementById('ch-content');
        if (!content) return;
        Array.prototype.forEach.call(content.querySelectorAll('span.sem-sen'), function(span) {
            span.replaceWith(document.createTextNode(span.textContent));
        });
        Array.prototype.forEach.call(content.querySelectorAll('.sem-para'), function(wrap) {
            var slot = wrap.querySelector('.sem-note, .sem-generate');
            if (slot) slot.remove();
            var fragment = document.createDocumentFragment();
            while (wrap.firstChild) fragment.appendChild(wrap.firstChild);
            wrap.replaceWith(fragment);
        });
        content.querySelectorAll('[data-sem-done="1"]').forEach(function(block) { delete block.dataset.semDone; });
        _cache[currentChapter] = null;
        await afterChapter();
    }

    return {
        afterChapter: afterChapter,
        refresh: refresh,
        layout: layout,
    };
})();

// 页面加载完成后恢复已记录的高亮/书签（离开页面再回来依然可见）
setTimeout(function() { AuxLayer.restore(); SemMargin.afterChapter(); restoreAgentRunState(); }, 400);

// ── 笔记页抽屉：右侧小方框向左拖动拉出（宽度=笔记页展示宽度），向右拖过最小宽度即收起 ──
// 用 iframe 内嵌 /notes/{book_id}：笔记页自身完全不动，宽度由这里手动限定
// ── 笔记页抽屉（右侧）：开关型 —— 点最右小方框展开，收起键在全书层页面内部（.nb-collapse）──
var notesDrawer = document.getElementById('notes-drawer');
var notesFrame = document.getElementById('notes-frame');
var notesGrip = document.getElementById('notes-grip');
var NOTES_URL = '/notes/' + encodeURIComponent(BOOK_ID);
var NOTES_DEFAULT_W = 440;                 // 展开宽度（固定，不拖）
var NOTES_GAP = 28;                        // 与正文右边界再留些距离，不贴上去

// 展开宽度上限：抽屉左缘不越过正文右边界（再留 NOTES_GAP）；正文右边界每次实时取
function notesMaxWidth() {
    var el = document.getElementById('ch-content');
    var right = el ? el.getBoundingClientRect().right : 0;
    if (!right || right > window.innerWidth) right = window.innerWidth;
    return Math.max(220, Math.round(window.innerWidth - right) - NOTES_GAP);
}

function openNotesDrawer() {
    if (!notesFrame.getAttribute('src')) notesFrame.setAttribute('src', NOTES_URL);   // 首次展开才加载
    notesDrawer.classList.add('open');
    notesDrawer.style.width = Math.min(NOTES_DEFAULT_W, notesMaxWidth()) + 'px';
    notesGrip.style.display = 'none';      // 展开后不再有外凸的把手
}

// 由全书层页面里的收起键调用（同源 iframe：window.parent.closeNotesDrawer()）
function closeNotesDrawer() {
    notesDrawer.classList.remove('open');
    notesGrip.style.display = 'flex';
}

notesGrip.addEventListener('click', openNotesDrawer);

// 窗口尺寸变化后重新夹紧宽度，避免越过正文右边界
window.addEventListener('resize', function() {
    if (notesDrawer.classList.contains('open')) {
        notesDrawer.style.width = Math.min(NOTES_DEFAULT_W, notesMaxWidth()) + 'px';
    }
});

</script>
</body>
</html>
